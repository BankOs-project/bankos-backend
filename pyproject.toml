[project]
name = "bankos-backend"
version = "0.1.0"
description = "BankOS - Sistema Bancario Multitenant como Servicio (Backend)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy[asyncio]>=2.0.32",
    "asyncpg>=0.29.0",
    "redis>=5.0.8",
    "httpx>=0.27.0",
    "pyjwt[crypto]>=2.9.0",
    "pwdlib[argon2,bcrypt]>=0.2.1",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

