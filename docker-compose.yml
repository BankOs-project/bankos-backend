services:
  db:
    image: postgres:15-alpine
    container_name: bankos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-bankos_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-bankos_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - bankos_network

  redis:
    image: redis:7-alpine
    container_name: bankos_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s
    networks:
      - bankos_network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bankos_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PROJECT_NAME: "BankOS API"
      ENVIRONMENT: "development"
      DEBUG: "true"
      SECRET_KEY: "${SECRET_KEY:-bankos-development-secret-key-change-this-in-production-min-32-chars-long!}"
      JWT_ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      POSTGRES_SERVER: "db"
      POSTGRES_PORT: "5432"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres_secure_password}"
      POSTGRES_DB: "${POSTGRES_DB:-bankos_db}"
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_password}@db:5432/${POSTGRES_DB:-bankos_db}"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      REDIS_URL: "redis://redis:6379/0"
    volumes:
      - ./app:/app/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bankos_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  bankos_network:
    driver: bridge

